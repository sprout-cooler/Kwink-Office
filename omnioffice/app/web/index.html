<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全能办公室</title>
    <meta name="description" content="统一的工作入口：把分散在各系统的工作内容收拢到一处。" />
    <!--
      内联 SVG favicon：品牌渐变圆角方块 + 字母 O。
      为什么内联而不是图片文件：
        1) NAS 可能离线，额外资源请求会 404（浏览器控制台报错）；
        2) data URI 无需网络请求，离线可用；
        3) 颜色与 --oo-gradient-brand 一致，不会与新设计脱节。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234c6fff'/%3E%3Cstop offset='1' stop-color='%237c5cf0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial,sans-serif' font-size='36' font-weight='700' fill='%23fff' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
