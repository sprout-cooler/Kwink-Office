# Docker 编排（V10 8.7）：api / worker / postgres / redis 四服务。
# 关键挂载：api 必须挂 ${TRIM_APPDEST} 到 /host 以创建网关 Socket（app.sock）；
# 数据库/缓存挂 ${TRIM_PKGVAR}（应用运行时数据目录，升级保留）；
# 用户文件（原图/模板/导出）挂 ${TRIM_PKGVAR}/data —— **必须是 PKGVAR，不能是 APPDEST**。
#
# v1.0.23 修复（模板文件丢失事故）：
#   原挂载是 ${TRIM_APPDEST}/share:/data，而 TRIM_APPDEST 是**安装目录 target**，
#   fnOS 升级/重装会整目录清空；但数据库挂在 ${TRIM_PKGVAR} 升级保留。
#   于是升级后必然出现「DB 模板记录还在、模板文件已被清空」的脏状态：
#   用户既删不掉（被批次绑定 409），又传不上去（同 md5 被判重复直接返回），
#   只能不断新增模板。数据目录必须与数据库同处 TRIM_PKGVAR，同生共死。
# v1.0.28 修复（安装卡 80% 事故）：
#   原来 api/worker 只有 build: 段 → fnOS 升级时 compose 现场冷构建镜像，
#   而 Dockerfile 第 7 步 apt 装 LibreOffice 独占 345 秒，冷构建实测 9 分 15 秒，
#   远超 fnOS 的 12.5 分钟升级超时（14:00:17 起每 30 秒轮询一次，共 25 次）
#   → 14:12:47 被杀（exit status -1），UI 永远卡在 80%。
#   修法：加 image: 段指向**预构建并已推送到 Docker Hub 的版本化镜像**。
#   实测（Docker Compose v5.0.2，NAS 上对照实验）：
#     image: + build: 并存且本地无该 tag 时 → compose **优先 pull 远端镜像**，
#     实测日志 `Image kwink/kwinkguide:0.5.43 Pulling → Pulled`，未触发构建。
#   实测 NAS 拉取 kwink/kwinkoffice:1.0.28 耗时 **2 分 44 秒**（vs 冷构建 9 分 15 秒）。
#   build: 段保留作为**兜底**：镜像拉不动时 compose 会回退到本地构建，功能不中断。
#
#   ⚠️ image 的 tag 必须与 manifest.version 同版本（check-fpk.mjs 有门禁校验
#      manifest.version === compose 的 APP_VERSION === compose 的 image tag），
#      否则 NAS 拉到的镜像与包内前端产物版本不匹配。
#      版本号由 scripts/build-fpk.js 在打包时统一递增并回写本文件
#      （manifest + APP_VERSION 兜底值 + image tag 三处一起同步），
#      因此**这里必须与当前 manifest.version 保持一致**，不要手改。
services:
  api:
    image: kwink/kwinkoffice:${APP_VERSION:-1.0.35}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: omnioffice-api
    restart: unless-stopped
    environment:
      - GATEWAY_PREFIX=/app/omnioffice
      - SOCKET_PATH=/host/app.sock
      - DATA_DIR=/data
      # 历史遗留目录：升级前模板/原图落在安装目录下，升级时被清空。
      # 保留只读挂载，让服务端能把仍在的旧文件搬进新目录（一次性迁移）。
      - LEGACY_DATA_DIR=/legacy-data
      - APP_VERSION=${APP_VERSION:-1.0.35}
      - DATABASE_URL=postgresql://omnioffice:omnioffice@postgres:5432/omnioffice
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${llm_api_key}
      - LLM_BASE_URL=${llm_base_url}
      - LLM_BASE_URL_CUSTOM=${llm_base_url_custom}
      - LLM_MODEL=${llm_model}
      # 腾讯地图 Key（经营大屏出差路径用）。经向导注入 → 存 user_settings →
      # 前端永远拿不到明文，地图请求由服务端反代注入。
      - TENCENT_MAP_KEY=${tencent_map_key}
    volumes:
      - ${TRIM_APPDEST}:/host
      - ${TRIM_PKGVAR}/data:/data
      - ${TRIM_APPDEST}/share:/legacy-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: kwink/kwinkoffice:${APP_VERSION:-1.0.35}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: omnioffice-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=postgresql://omnioffice:omnioffice@postgres:5432/omnioffice
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${llm_api_key}
      - LLM_BASE_URL=${llm_base_url}
      - LLM_BASE_URL_CUSTOM=${llm_base_url_custom}
      - LLM_MODEL=${llm_model}
    volumes:
      - ${TRIM_PKGVAR}/data:/data
      - ${TRIM_APPDEST}/share:/legacy-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: omnioffice-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=omnioffice
      - POSTGRES_PASSWORD=omnioffice
      - POSTGRES_DB=omnioffice
    volumes:
      - ${TRIM_PKGVAR}/postgres:/var/lib/postgresql/data
    healthcheck:
      # 配合 api 的应用层重试双保险：明确 PG 就绪信号（v1.0.3 Bad Gateway 修复）
      test: ["CMD-SHELL", "pg_isready -U omnioffice -d omnioffice"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: omnioffice-redis
    restart: unless-stopped
    volumes:
      - ${TRIM_PKGVAR}/redis:/data
